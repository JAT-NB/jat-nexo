const menuNav=()=>[['home','Inicio','inicio'],['clients','Clientes','clientes'],['property','Propiedades','propiedades'],['match','Coincidencias','coincidencias'],['follow','Seguimientos','seguimientos']].map(([i,t,d])=>`<button type="button" class="nav-link" data-destino="${d}">${icon(i)}<span>${t}</span></button>`).join('');

function sincronizarNav(){const grupo=pantalla.startsWith('cliente')?'clientes':pantalla.startsWith('propiedad')?'propiedades':pantalla.startsWith('seguimiento')?'seguimientos':pantalla;document.querySelectorAll('[data-destino]').forEach(b=>{const activo=b.dataset.destino===grupo;b.classList.toggle('active',activo);if(activo)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});const nombres={inicio:'Inicio',clientes:'Clientes',propiedades:'Propiedades',coincidencias:'Coincidencias',seguimientos:'Seguimientos'};$('seccionActual').textContent=nombres[grupo]||'Inicio';}
function dashboard(){
 const pares=disponible('clientes','propiedades')?datos.clientes.reduce((n,c)=>n+datos.propiedades.filter(p=>coincide(c,p)).length,0):null;
 const proximos=abiertos().filter(s=>s.fecha>=fechaHoy()).sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha))).slice(0,3);
 const ultimos=[...datos.clientes].sort((a,b)=>(b.fechaCreacion?.toMillis?.()||0)-(a.fechaCreacion?.toMillis?.()||0)).slice(0,4);
 const metric=(titulo,n,detalle,i)=>`<div class="metric"><div class="metric-top"><span>${titulo}</span><div class="tile-icon">${icon(i)}</div></div><div class="metric-value">${n===null?'—':n}</div><div class="metric-foot">${detalle}</div></div>`;
 const panel=(titulo,i,accion,contenido)=>`<section class="panel"><div class="panel-title"><h3>${icon(i)}${titulo}</h3>${boton('Ver todos',accion,'','secundario')}</div>${contenido}</section>`;
 return `<div class="page-heading"><div><p class="page-eyebrow">Tu actividad inmobiliaria</p>${cabecera('Buen día, bienvenido','Tus clientes, propiedades y oportunidades, en un solo lugar.')}</div><span class="date-label">${new Date().toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric'})}</span></div><div class="metrics">${metric('Clientes',disponible('clientes')?datos.clientes.length:null,'Contactos registrados','clients')}${metric('Propiedades',disponible('propiedades')?datos.propiedades.length:null,'En tu catálogo','property')}${metric('Coincidencias',pares,'Oportunidades compatibles','match')}${metric('Seguimientos abiertos',disponible('seguimientos')?abiertos().length:null,'Pendientes de resolución','follow')}</div><div class="dashboard-grid"><div><section class="panel"><div class="panel-title"><h3>${icon('plus')}Accesos rápidos</h3></div><div class="quick-actions">${tile('Nuevo cliente','Sumá un contacto','nuevoCliente','clients')}${tile('Nueva propiedad','Ampliá tu catálogo','nuevaPropiedad','property')}${tile('Ver coincidencias','Encontrá oportunidades','ir:coincidencias','match')}${tile('Nuevo seguimiento','Planificá el próximo paso','nuevoSeguimiento','follow')}</div></section>${panel('Últimos clientes','clients','ir:clientesLista',!disponible('clientes')?'<p class="panel-empty">Esperando la lectura de clientes…</p>':ultimos.length?ultimos.map(c=>`<div class="mini-row"><div class="avatar">${escapar(iniciales(c.nombre))}</div><div class="mini-content"><strong>${escapar(c.nombre)}</strong><p>${escapar(c.operacion)}${busca(c)?' · '+escapar(c.zona):''}</p></div><button type="button" data-accion="editarCliente" data-id="${escapar(c.id)}" aria-label="Ver cliente ${escapar(c.nombre)}">${icon('right')}</button></div>`).join(''):`<div class="panel-empty">${icon('clients')}Todavía no hay clientes. Cargá el primero desde los accesos rápidos.</div>`)}</div><div class="dashboard-right">${panel('Próximos seguimientos','follow','ir:seguimientos',!disponible('seguimientos','clientes')?'<p class="panel-empty">Esperando la lectura de seguimientos…</p>':proximos.length?proximos.map(s=>`<div class="mini-row"><div class="tile-icon">${icon('follow')}</div><div class="mini-content"><strong>${escapar(porId('clientes',s.clienteId)?.nombre||'Cliente no disponible')}</strong><p>${fechaTexto(s.fecha)} · ${escapar(s.estado)}</p><p>${escapar(s.nota)}</p></div><button type="button" data-accion="editarSeguimiento" data-id="${escapar(s.id)}" aria-label="Ver seguimiento de ${escapar(porId('clientes',s.clienteId)?.nombre||'cliente')}">${icon('right')}</button></div>`).join(''):`<div class="panel-empty">${icon('follow')}No hay próximos seguimientos.${disponible('seguimientos')&&abiertos().some(s=>s.fecha<fechaHoy())?' Hay seguimientos vencidos: revisalos en el listado.':' Organizá tu próxima acción desde los accesos rápidos.'}</div>`)}${panel('Resumen de propiedades','property','ir:propiedades',!disponible('propiedades')?'<p class="panel-empty">Esperando la lectura de propiedades…</p>':datos.propiedades.length?`<div class="summary-row"><span>En venta</span><strong>${datos.propiedades.filter(p=>p.operacion==='Venta').length}</strong></div><div class="summary-row"><span>En alquiler</span><strong>${datos.propiedades.filter(p=>p.operacion==='Alquiler').length}</strong></div><div class="summary-row"><span>Disponibles</span><strong>${datos.propiedades.filter(p=>p.estado==='Disponible').length}</strong></div><div class="summary-row"><span>Reservadas</span><strong>${datos.propiedades.filter(p=>p.estado==='Reservada').length}</strong></div>`:`<div class="panel-empty">${icon('property')}Todavía no hay propiedades en el catálogo. Agregá una para encontrar coincidencias.</div>`)}</div></div>`;

function estadoConexion(){ $('conexion').innerHTML=Object.keys(datos).map(k=>errores[k]?`<div class="aviso error">No se pudo leer ${k}: ${escapar(errores[k])}. Revisá la conexión y los permisos de Firestore. ${boton('Reintentar lectura','recargar',k)}</div>`:!carga[k]?`<p class="muted">Cargando ${k}…</p>`:'').join(''); }
function disponible(...nombres){return nombres.every(k=>carga[k]&&!errores[k]);}
function requerir(...nombres){if(!disponible(...nombres)){avisar('Esperá a que los datos se carguen o reintentá la lectura antes de continuar.',true);return false;}return true;}
const suscripciones={};
function escuchar(nombre){
 suscripciones[nombre]?.();carga[nombre]=false;delete errores[nombre];estadoConexion();
 suscripciones[nombre]=onSnapshot(collection(db,nombre),s=>{datos[nombre]=s.docs.map(d=>({...d.data(),id:d.id}));carga[nombre]=true;delete errores[nombre];estadoConexion();if(!pantalla.endsWith('Formulario'))renderizar();},e=>{carga[nombre]=false;errores[nombre]=e.code||e.message;estadoConexion();if(!pantalla.endsWith('Formulario'))renderizar();});
}
function cambiar(destino){if(ocupado)return; pantalla=destino;edicion=null;referenciaNueva=null;consulta='';filtroEstado='';$('notificacion').textContent='';renderizar();window.scrollTo(0,0);}
function opciones(valores,valor,placeholder=''){return (placeholder?`<option value="">${escapar(placeholder)}</option>`:'')+valores.map(v=>`<option value="${escapar(v)}" ${v===valor?'selected':''}>${escapar(v)}</option>`).join('');}
function campo(id,titulo,valor='',tipo='text',atributos=''){const auto=['nombre','telefono','email'].includes(id)?' autocomplete="off"':'';return `<label for="${id}">${escapar(titulo)}</label><input id="${id}" name="${id}" type="${tipo}" value="${escapar(valor)}" ${atributos}${auto}>`;}
function selector(id,titulo,valores,valor,placeholder=''){return `<label for="${id}">${escapar(titulo)}</label><select id="${id}" name="${id}">${opciones(valores,valor,placeholder)}</select>`;}
function datosInmueble(prefijo,p={}){return campo(prefijo+'Direccion','Dirección',p.direccion||'','text','required maxlength="200"')+`<div class="field-grid"><div>${campo(prefijo+'Zona','Barrio / zona',p.zona||'','text','required maxlength="150"')}</div><div>${selector(prefijo+'Tipo','Tipo de propiedad',TIPOS,p.tipo||'','Seleccionar tipo')}</div><div>${campo(prefijo+'Ambientes','Ambientes',p.ambientes??'','number','required min="0" step="1"')}</div><div>${selector(prefijo+'Moneda','Moneda',['USD','ARS'],p.moneda||'USD')}</div></div>`+campo(prefijo+'Precio','Precio',p.precio??'','number','required min="0" step="0.01"');}
function formularioCliente(){const c=porId('clientes',edicion)||{};return cabecera(edicion?'Editar cliente':'Nuevo cliente')+`<form id="clienteForm" class="bienvenida" autocomplete="off">${campo('nombre','Nombre y apellido',c.nombre||'','text','required maxlength="120"')}${campo('telefono','Teléfono / WhatsApp (con código de país)',c.telefono||'','tel','maxlength="40" placeholder="Ej.: +54 9 11 1234 5678"')}${campo('email','Email (opcional)',c.email||'','email','maxlength="200"')}${selector('operacion','¿Qué necesita el cliente?',OPERACIONES,c.operacion||'','Seleccionar operación')}<div class="operation-choices">${OPERACIONES.map((o,i)=>`<button type="button" class="operation-pill ${c.operacion===o?'active':''}" data-operacion="${o}" aria-pressed="${c.operacion===o}">${icon(['search','key','home','key'][i])}${['Comprador','Inquilino','Vendedor','Propietario que alquila'][i]}</button>`).join('')}</div><fieldset id="busquedaCampos" class="form-section" style="border:0;padding:0;"><legend class="titulo-opciones">Datos de búsqueda</legend><div class="tipos-propiedad">${TIPOS.map(t=>`<label class="opcion-tipo"><input type="checkbox" name="tipoBusqueda" value="${t}" ${(c.tiposPropiedad||[]).includes(t)?'checked':''}>${t}</label>`).join('')}</div>${campo('zona','Barrios que busca (separados por +)',c.zona||'','text','required maxlength="250" placeholder="Palermo + Belgrano"')}${selector('moneda','Moneda',['USD','ARS'],c.moneda||'USD')}${campo('presupuesto','Presupuesto máximo',c.presupuestoMaximo??'','number','required min="0" step="0.01"')}${campo('ambientes','Ambientes mínimos',c.ambientes??'','number','required min="0" step="1"')}</fieldset><fieldset id="propietarioCampos" class="form-section" style="border:0;padding:0;"><legend class="titulo-opciones">Propiedad del cliente</legend><p class="muted">Estos datos quedan en su ficha. Después podés usar “Cargar propiedad” para incorporarla al catálogo y generar coincidencias.</p>${datosInmueble('dueno',c.propiedad||{})}</fieldset><button type="submit">${icon('check')}${edicion?'Guardar cambios':'Guardar cliente'}</button>${volver('clientes')}</form>`;}
function ajustarOperacion(){const esPropietario=OPERACIONES.slice(2).includes($('operacion').value);$('busquedaCampos').hidden=esPropietario;$('busquedaCampos').disabled=esPropietario;$('propietarioCampos').hidden=!esPropietario;$('propietarioCampos').disabled=!esPropietario;}
function formularioPropiedad(){const p=edicion?porId('propiedades',edicion)||{}:(window.borradorPropiedad||{});return cabecera(edicion?'Editar propiedad':'Nueva propiedad')+`<form id="propiedadForm" class="bienvenida">${datosInmueble('inmueble',p)}${selector('inmuebleOperacion','Operación',['Venta','Alquiler'],p.operacion||'Venta')}${selector('inmuebleEstado','Estado',['Disponible','Reservada','Vendida','Alquilada'],p.estado||'Disponible')}<label for="propietarioId">Propietario (opcional)</label><select id="propietarioId"><option value="">Sin propietario vinculado</option>${datos.clientes.filter(c=>propietario(c)||c.id===p.propietarioId).map(c=>`<option value="${escapar(c.id)}" ${c.id===p.propietarioId?'selected':''}>${escapar(c.nombre)}</option>`).join('')}</select><p class="muted">Para vincular otro propietario, cargalo primero en Clientes como vendedor o propietario que alquila.</p><label for="descripcion">Descripción (opcional)</label><textarea id="descripcion" maxlength="2000" rows="3">${escapar(p.descripcion||'')}</textarea><button type="submit">${icon('check')}${edicion?'Guardar cambios':'Guardar propiedad'}</button>${volver('propiedades')}</form>`;}

function listaClientes(){if(!disponible('clientes'))return '<p class="loading-line">El listado estará disponible al completar la lectura de clientes.</p>';const lista=datos.clientes.filter(c=>normalizar([c.nombre,c.telefono,c.email,c.zona,c.operacion].join(' ')).includes(normalizar(consulta))).sort((a,b)=>String(a.nombre||'').localeCompare(String(b.nombre||''),'es'));return lista.length?lista.map(c=>`<article class="registro client-card"><div class="record-heading"><div class="record-title"><div class="avatar">${escapar(iniciales(c.nombre))}</div><h3>${escapar(c.nombre)}</h3></div>${estadoBadge(c.operacion)}</div><p class="record-contact">${icon('phone')}${escapar(c.telefono||'Sin teléfono')}${c.email?` · ${escapar(c.email)}`:''}</p>${busca(c)?`<div class="record-info"><span>${icon('property')}${escapar((c.tiposPropiedad||[]).join(', '))}</span><span>${icon('pin')}${escapar(c.zona)}</span><span>${icon('rooms')}${escapar(c.ambientes)} ambientes mínimos</span></div><div class="record-price">${escapar(importe(c.presupuestoMaximo,c.moneda))}<small>Presupuesto máximo</small></div>`:c.propiedad?`<div class="record-info"><span>${icon('pin')}${escapar(c.propiedad.direccion)} · ${escapar(c.propiedad.zona)}</span><span>${icon('property')}${escapar(c.propiedad.tipo)}</span><span>${icon('rooms')}${escapar(c.propiedad.ambientes)} ambientes</span></div><div class="record-price">${escapar(importe(c.propiedad.precio,c.propiedad.moneda))}<small>Precio pretendido</small></div>`:'<p class="muted">Sin datos de propiedad</p>'}<div class="acciones">${boton('Editar','editarCliente',c.id)}${boton('Eliminar','eliminarCliente',c.id,'peligro')}${boton('WhatsApp','whatsappCliente',c.id)}${boton('Seguimiento','seguimientoCliente',c.id)}${propietario(c)&&c.propiedad?boton('Cargar propiedad','propiedadCliente',c.id):''}</div></article>`).join(''):empty('No hay clientes para mostrar.',consulta?'Probá con otro nombre, barrio o dato de contacto.':'Agregá tu primer cliente para organizar sus búsquedas y oportunidades.','clients');}
function listaPropiedades(){if(!disponible('propiedades'))return '<p class="loading-line">El listado estará disponible al completar la lectura de propiedades.</p>';const lista=datos.propiedades.filter(p=>normalizar([p.direccion,p.zona,p.tipo,p.operacion,p.estado].join(' ')).includes(normalizar(consulta))).sort((a,b)=>String(a.direccion||'').localeCompare(String(b.direccion||''),'es'));return lista.length?lista.map(p=>`<article class="registro property-card"><div class="property-meta">${estadoBadge(p.operacion)}${estadoBadge(p.estado||'Disponible')}</div><div class="property-heading"><div class="property-icon">${icon(p.tipo==='Casa'?'home':'property')}</div><div><h3>${escapar(p.direccion)}</h3><p class="record-subtitle">${escapar(p.tipo)} · ${escapar(p.zona)}</p></div></div><div class="record-price">${escapar(importe(p.precio,p.moneda))}</div><div class="record-info"><span>${icon('rooms')}${escapar(p.ambientes)} ambientes</span><span>${icon('pin')}${escapar(p.zona)}</span></div><p class="owner-row">Propietario: <strong>${escapar(porId('clientes',p.propietarioId)?.nombre||(p.propietarioId?'Cliente no disponible':'Sin vincular'))}</strong></p>${p.descripcion?`<p class="property-description">${escapar(p.descripcion)}</p>`:''}<div class="acciones">${boton('Editar','editarPropiedad',p.id)}${boton('Eliminar','eliminarPropiedad',p.id,'peligro')}</div></article>`).join(''):empty('No hay propiedades para mostrar.',consulta?'Probá con otra dirección, barrio o estado.':'Agregá propiedades reales para empezar a encontrar coincidencias.','property');}
// Exact normalized neighborhood membership, same currency (no currency conversion),
// price <= maximum budget and rooms >= requested minimum. No fuzzy matches.
function coincide(c,p){const zonas=barrios(c.zona).map(normalizar);return busca(c)&&p.estado==='Disponible'&&p.operacion===(c.operacion==='Busca comprar'?'Venta':'Alquiler')&&(c.tiposPropiedad||[]).map(normalizar).includes(normalizar(p.tipo))&&zonas.length>0&&zonas.includes(normalizar(p.zona))&&c.moneda===p.moneda&&Number.isFinite(Number(c.presupuestoMaximo))&&Number.isFinite(Number(p.precio))&&Number.isFinite(Number(c.ambientes))&&Number.isFinite(Number(p.ambientes))&&Number(p.precio)>=0&&Number(p.precio)<=Number(c.presupuestoMaximo)&&Number(p.ambientes)>=Number(c.ambientes);}
function listaCoincidencias(){if(!disponible('clientes','propiedades'))return '<p class="loading-line">Esperando los datos de clientes y propiedades.</p>';const pares=datos.clientes.flatMap(c=>datos.propiedades.filter(p=>coincide(c,p)).map(p=>({c,p})));return pares.length?pares.map(({c,p})=>`<article class="registro match-card"><div class="match-pair"><div class="match-side"><p class="match-label">Cliente interesado</p><h3>${escapar(c.nombre)}</h3><p class="record-subtitle">${escapar(c.operacion)}</p></div><div class="match-connector">${icon('match')}</div><div class="match-side"><p class="match-label">Propiedad compatible</p><h3>${escapar(p.direccion)}</h3><p class="record-subtitle">${escapar(p.operacion)} · ${escapar(p.estado)}</p></div></div><dl class="match-criteria"><div><dt>Zona compatible</dt><dd>${escapar(p.zona)}<br><span class="muted">Busca: ${escapar(c.zona)}</span></dd></div><div><dt>Tipo de propiedad</dt><dd>${escapar(p.tipo)}<br><span class="muted">Busca: ${escapar((c.tiposPropiedad||[]).join(', '))}</span></dd></div><div><dt>Ambientes</dt><dd>${escapar(p.ambientes)} ambientes<br><span class="muted">Mínimo: ${escapar(c.ambientes)}</span></dd></div><div><dt>Moneda</dt><dd>${escapar(p.moneda)} · misma moneda</dd></div><div><dt>Presupuesto del cliente</dt><dd>${escapar(importe(c.presupuestoMaximo,c.moneda))}</dd></div><div><dt>Precio de la propiedad</dt><dd>${escapar(importe(p.precio,p.moneda))}</dd></div></dl><p class="match-check">${icon('check')}Cumple tipo, barrio, moneda, presupuesto y ambientes mínimos.</p><div class="acciones">${boton('Preparar WhatsApp','whatsappCoincidencia',JSON.stringify([c.id,p.id]))}${boton('Crear seguimiento','seguimientoCoincidencia',JSON.stringify([c.id,p.id]))}</div></article>`).join(''):empty('Todavía no hay coincidencias.','Cargá clientes y propiedades disponibles que cumplan los criterios. Las oportunidades compatibles aparecerán automáticamente.','match');}
function listaSeguimientos(){if(!disponible('seguimientos','clientes','propiedades'))return '<p class="loading-line">Esperando los datos para mostrar seguimientos.</p>';const lista=datos.seguimientos.filter(s=>!filtroEstado||s.estado===filtroEstado).sort((a,b)=>String(a.fecha||'').localeCompare(String(b.fecha||'')));return lista.length?lista.map(s=>`<article class="registro follow-card"><div class="record-heading"><div class="record-title"><div class="avatar">${icon('follow')}</div><h3>${escapar(porId('clientes',s.clienteId)?.nombre||'Cliente no disponible')}</h3></div>${estadoBadge(s.estado)}</div><div class="follow-date">${icon('clock')}${fechaTexto(s.fecha)}${s.fecha<fechaHoy()&&!['Cerrado','Descartado'].includes(s.estado)?estadoBadge('Vencido'):''}</div><div class="record-info"><span>${icon('property')}${escapar(porId('propiedades',s.propiedadId)?.direccion||'Sin propiedad vinculada')}</span></div><p class="follow-note"><strong>Próxima acción / nota</strong>${escapar(s.nota)}</p><div class="acciones">${boton('Editar','editarSeguimiento',s.id)}${boton('Eliminar','eliminarSeguimiento',s.id,'peligro')}${porId('clientes',s.clienteId)?boton('WhatsApp','whatsappCliente',s.clienteId):''}</div></article>`).join(''):empty('No hay seguimientos para mostrar.',filtroEstado?'No hay registros con ese estado.':'Planificá una visita, un contacto o tu próxima acción para un cliente.','follow');}
function renderizar(){let html='';switch(pantalla){case 'inicio':html=dashboard();break;case 'clientes':html=cabecera('Clientes','Administrá tus contactos, sus búsquedas y oportunidades.')+`<div class="menu">${tile('Nuevo cliente','Compradores, inquilinos y propietarios','nuevoCliente','plus')}${tile('Clientes guardados','Consultá y administrá tus contactos','ir:clientesLista','clients')}</div>`+volver('inicio');break;case 'clientesLista':html=cabecera('Clientes guardados','Tus contactos y lo que necesita cada uno.')+boton('Nuevo cliente','nuevoCliente')+`<div class="search-wrap"><div>${barraBusqueda('Buscar por nombre, teléfono, email, barrio u operación')}</div></div><div id="lista">${listaClientes()}</div>`+volver('clientes');break;case 'clienteFormulario':html=formularioCliente();break;case 'propiedades':html=cabecera('Propiedades','Un catálogo organizado para cada oportunidad.')+boton('Nueva propiedad','nuevaPropiedad')+`<div class="search-wrap"><div>${barraBusqueda('Buscar por dirección, barrio, tipo, operación o estado')}</div></div><div id="lista">${listaPropiedades()}</div>`+volver('inicio');break;case 'propiedadFormulario':html=formularioPropiedad();break;case 'coincidencias':html=cabecera('Coincidencias','Clientes interesados y propiedades compatibles. Misma operación y moneda, tipo y barrio compatibles, precio dentro del presupuesto y ambientes mínimos.')+listaCoincidencias()+volver('inicio');break;case 'seguimientos':html=cabecera('Seguimientos','Cada contacto, visita y próxima acción, en orden.')+boton('Nuevo seguimiento','nuevoSeguimiento')+`<div class="search-wrap"><div>${selector('filtroEstado','Filtrar por estado',ESTADOS,filtroEstado,'Todos')}</div></div><div id="lista">${listaSeguimientos()}</div>`+volver('inicio');break;case 'seguimientoFormulario':html=formularioSeguimiento();break;} $('pantalla').innerHTML=html;if(pantalla==='clienteFormulario')ajustarOperacion();sincronizarNav();bloquear(ocupado);}
function bloquear(valor){ocupado=valor;document.querySelectorAll('button').forEach(b=>b.disabled=valor);const f=document.querySelector('form');if(f)f.querySelectorAll('input,select,textarea').forEach(x=>{x.disabled=valor;});if(!valor&&pantalla==='clienteFormulario')ajustarOperacion();}
function texto(id){return $(id).value.trim();}
function numero(id,entero=false){const crudo=texto(id);const n=Number(crudo);if(!crudo||!Number.isFinite(n)||n<0||(entero&&!Number.isInteger(n)))throw new Error('Ingresá importes válidos y ambientes enteros no negativos.');return n;}
function leerInmueble(prefijo){const p={direccion:texto(prefijo+'Direccion'),zona:texto(prefijo+'Zona'),tipo:texto(prefijo+'Tipo'),ambientes:numero(prefijo+'Ambientes',true),moneda:texto(prefijo+'Moneda'),precio:numero(prefijo+'Precio')};if(!p.direccion||!p.zona||!TIPOS.includes(p.tipo))throw new Error('Completá dirección, barrio y tipo de propiedad.');if(p.zona.includes('+'))throw new Error('Cada propiedad debe tener un único barrio. Usá + solamente en la búsqueda del cliente.');return p;}
function errorOperacion(e){console.error('JAT Nexo:',e);avisar(e.code?`No se pudo guardar el cambio (${e.code}). Revisá la conexión y los permisos de Firestore. Los datos del formulario se conservan para reintentar.`:e.message,true);}
async function guardar(evento){evento.preventDefault();if(ocupado)return;const formulario=evento.target;if(!formulario.reportValidity())return;let nombre,payload;try{if(formulario.id==='clienteForm'){nombre='clientes';payload={nombre:texto('nombre'),telefono:texto('telefono'),email:texto('email'),operacion:texto('operacion')};if(!payload.nombre||!OPERACIONES.includes(payload.operacion))throw new Error('Completá nombre y operación.');if(busca(payload)){const tipos=Array.from(formulario.querySelectorAll('[name="tipoBusqueda"]:checked')).map(x=>x.value);if(!tipos.length)throw new Error('Seleccioná al menos un tipo de propiedad.');const zonas=barrios(texto('zona'));if(!zonas.length)throw new Error('Ingresá al menos un barrio.');Object.assign(payload,{tiposPropiedad:tipos,zona:zonas.join(' + '),moneda:texto('moneda'),presupuestoMaximo:numero('presupuesto'),ambientes:numero('ambientes',true),propiedad:null});}else{payload.propiedad=leerInmueble('dueno');Object.assign(payload,{tiposPropiedad:[],zona:'',moneda:'USD',presupuestoMaximo:0,ambientes:0});}}
 else if(formulario.id==='propiedadForm'){nombre='propiedades';payload={...leerInmueble('inmueble'),operacion:texto('inmuebleOperacion'),estado:texto('inmuebleEstado'),propietarioId:texto('propietarioId'),descripcion:texto('descripcion')};if(!requerir('clientes','propiedades'))return;if(payload.propietarioId&&!porId('clientes',payload.propietarioId))throw new Error('El propietario ya no existe. Elegí otro o dejalo sin vincular.');}
 else if(formulario.id==='seguimientoForm'){nombre='seguimientos';if(!requerir('clientes','propiedades','seguimientos'))return;payload={clienteId:texto('seguimientoCliente'),propiedadId:texto('seguimientoPropiedad'),estado:texto('seguimientoEstado'),fecha:texto('seguimientoFecha'),nota:texto('nota')};if(!porId('clientes',payload.clienteId))throw new Error('Seleccioná un cliente existente.');if(payload.propiedadId&&!porId('propiedades',payload.propiedadId))throw new Error('La propiedad ya no existe.');if(!payload.nota||!payload.fecha)throw new Error('Completá fecha y nota.');}else return;
 if(edicion&&!confirm('¿Guardar los cambios de este registro?'))return;
 bloquear(true);const editando=edicion;const ref=editando?doc(db,nombre,editando):(referenciaNueva||(referenciaNueva=doc(collection(db,nombre))));if(editando){await updateDoc(ref,{...payload,fechaActualizacion:serverTimestamp()});}else{await setDoc(ref,{...payload,fechaCreacion:serverTimestamp()});}
 // Update memory immediately; snapshot subscription will keep it synchronized.
 const anterior=porId(nombre,ref.id)||{};datos[nombre]=datos[nombre].filter(x=>x.id!==ref.id).concat({...anterior,...payload,id:ref.id});bloquear(false);window.borradorPropiedad=null;window.borradorSeguimiento=null;cambiar(nombre==='clientes'?'clientesLista':nombre);avisar(editando?'Cambios guardados.':'Registro guardado correctamente. El formulario quedó limpio.');
 }catch(e){errorOperacion(e);}finally{bloquear(false);}}
async function eliminar(nombre,id){if(ocupado||!requerir('clientes','propiedades','seguimientos'))return;const registro=porId(nombre,id);if(!registro)return;const props=nombre==='clientes'?datos.propiedades.filter(p=>p.propietarioId===id):[];const segs=nombre==='clientes'?datos.seguimientos.filter(s=>s.clienteId===id):nombre==='propiedades'?datos.seguimientos.filter(s=>s.propiedadId===id):[];
 if(props.length+segs.length+1>450){avisar('Hay demasiados vínculos para eliminar este registro en una sola operación. Reducí los seguimientos asociados primero.',true);return;}
 const detalle=nombre==='clientes'?` Se eliminarán ${segs.length} seguimientos y ${props.length} propiedades quedarán sin propietario (las propiedades se conservan).`:nombre==='propiedades'?` Se conservarán los seguimientos, quitando ${segs.length} vínculos con esta propiedad.`:'';
 if(!confirm(`¿Eliminar ${registro.nombre||registro.direccion||'este seguimiento'}?${detalle} Esta acción no se puede deshacer.`))return;
 bloquear(true);try{const lote=writeBatch(db);lote.delete(doc(db,nombre,id));props.forEach(p=>lote.update(doc(db,'propiedades',p.id),{propietarioId:'',fechaActualizacion:serverTimestamp()}));segs.forEach(s=>nombre==='clientes'?lote.delete(doc(db,'seguimientos',s.id)):lote.update(doc(db,'seguimientos',s.id),{propiedadId:'',fechaActualizacion:serverTimestamp()}));await lote.commit();datos[nombre]=datos[nombre].filter(x=>x.id!==id);if(nombre==='clientes'){datos.propiedades=datos.propiedades.map(p=>p.propietarioId===id?{...p,propietarioId:''}:p);datos.seguimientos=datos.seguimientos.filter(s=>s.clienteId!==id);}if(nombre==='propiedades')datos.seguimientos=datos.seguimientos.map(s=>s.propiedadId===id?{...s,propiedadId:''}:s);renderizar();avisar('Registro eliminado.');}catch(e){errorOperacion(e);}finally{bloquear(false);}}
function abrirFormulario(tipo,id=null){const coleccion={cliente:'clientes',propiedad:'propiedades',seguimiento:'seguimientos'}[tipo];if(id&&!porId(coleccion,id))return;if(tipo==='propiedad'&&!requerir('clientes','propiedades'))return;if(tipo==='seguimiento'&&!requerir('clientes','propiedades','seguimientos'))return;cambiar(tipo+'Formulario');edicion=id;renderizar();}
function prepararWhatsApp(c,p=null){if(!c)return;const telefono=String(c.telefono||'').replace(/\D/g,'');if(!/^\d{8,15}$/.test(telefono)){avisar('Editá el teléfono del cliente e ingresalo con código de país; por ejemplo +54 9 11 1234 5678.',true);return;}let mensaje=`Hola ${c.nombre}, ¿cómo estás? Te contacto por tu consulta inmobiliaria.`;if(p)mensaje=`Hola ${c.nombre}, encontré una propiedad que coincide con tu búsqueda: ${p.tipo} en ${p.zona}, ${p.direccion}, ${p.ambientes} ambientes, ${importe(p.precio,p.moneda)} (${p.operacion}). ¿Querés que coordinemos una visita?`;const url=`https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`;window.open(url,'_blank','noopener,noreferrer');}
$('pantalla').addEventListener('click',e=>{const b=e.target.closest('[data-accion]');if(!b||ocupado)return;const accion=b.dataset.accion,id=b.dataset.id;if(accion.startsWith('ir:'))return cambiar(accion.slice(3));switch(accion){case 'nuevoCliente':abrirFormulario('cliente');break;case 'editarCliente':abrirFormulario('cliente',id);break;case 'eliminarCliente':eliminar('clientes',id);break;case 'nuevaPropiedad':window.borradorPropiedad=null;abrirFormulario('propiedad');break;case 'editarPropiedad':abrirFormulario('propiedad',id);break;case 'eliminarPropiedad':eliminar('propiedades',id);break;case 'nuevoSeguimiento':window.borradorSeguimiento=null;abrirFormulario('seguimiento');break;case 'editarSeguimiento':abrirFormulario('seguimiento',id);break;case 'eliminarSeguimiento':eliminar('seguimientos',id);break;case 'whatsappCliente':prepararWhatsApp(porId('clientes',id));break;case 'whatsappCoincidencia':{const [c,p]=JSON.parse(id);prepararWhatsApp(porId('clientes',c),porId('propiedades',p));break;}case 'seguimientoCliente':window.borradorSeguimiento={clienteId:id};abrirFormulario('seguimiento');break;case 'seguimientoCoincidencia':{const [c,p]=JSON.parse(id);window.borradorSeguimiento={clienteId:c,propiedadId:p};abrirFormulario('seguimiento');break;}case 'propiedadCliente':{if(!requerir('clientes','propiedades'))break;const c=porId('clientes',id);if(!c?.propiedad)break;const existente=datos.propiedades.find(p=>p.propietarioId===id&&normalizar(p.direccion)===normalizar(c.propiedad.direccion));if(existente){avisar('Esa propiedad ya está cargada. Se abrió para editarla.');abrirFormulario('propiedad',existente.id);}else{window.borradorPropiedad={...c.propiedad,propietarioId:id,operacion:c.operacion==='Quiere vender'?'Venta':'Alquiler',estado:'Disponible'};abrirFormulario('propiedad');}break;}}});
$('conexion').addEventListener('click',e=>{const b=e.target.closest('[data-accion="recargar"]');if(b&&!ocupado)escuchar(b.dataset.id);});
$('pantalla').addEventListener('submit',guardar);
$('pantalla').addEventListener('change',e=>{if(e.target.id==='operacion')ajustarOperacion();if(e.target.id==='filtroEstado'){filtroEstado=e.target.value;$('lista').innerHTML=listaSeguimientos();}});
$('pantalla').addEventListener('input',e=>{if(e.target.id==='buscar'){consulta=e.target.value;$('lista').innerHTML=pantalla==='clientesLista'?listaClientes():listaPropiedades();}});
$('navDesktop').innerHTML=menuNav();$('navMobile').innerHTML=menuNav();document.querySelectorAll('[data-brand-icon]').forEach(x=>x.innerHTML=icon('home'));
for(const id of ['navDesktop','navMobile'])$(id).addEventListener('click',e=>{const b=e.target.closest('[data-destino]');if(b&&!ocupado)cambiar(b.dataset.destino);});
$('pantalla').addEventListener('click',e=>{const b=e.target.closest('[data-operacion]');if(!b||ocupado)return;$('operacion').value=b.dataset.operacion;ajustarOperacion();document.querySelectorAll('[data-operacion]').forEach(x=>{const activo=x.dataset.operacion===$('operacion').value;x.classList.toggle('active',activo);x.setAttribute('aria-pressed',String(activo));});});

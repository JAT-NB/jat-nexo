<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import {getFirestore,collection,doc,setDoc,updateDoc,writeBatch,onSnapshot,serverTimestamp} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyChga286wDg0Ds9k1i0x0ImME21fCybTm4',authDomain:'jat-nexo.firebaseapp.com',projectId:'jat-nexo',storageBucket:'jat-nexo.firebasestorage.app',messagingSenderId:'123468270889',appId:'1:123468270889:web:6a507a7d01e1bf23553b38'};
const db=getFirestore(initializeApp(firebaseConfig));
const $=id=>document.getElementById(id);
const TIPOS=['Departamento','Casa','PH','Local','Oficina','Terreno','Otro'];
const OPERACIONES=['Busca comprar','Busca alquilar','Quiere vender','Quiere alquilar propiedad'];
const ESTADOS=['Pendiente','Contactado','Visita agendada','En negociación','Cerrado','Descartado'];
const datos={clientes:[],propiedades:[],seguimientos:[]};
const carga={clientes:false,propiedades:false,seguimientos:false};
const errores={};
let clienteSeleccionado=null;
let pantalla='inicio',edicion=null,ocupado=false,consulta='',filtroEstado='';
// Keep a generated document reference across a failed retry: repeated clicks/retries
// update the same document instead of creating another copy.
let referenciaNueva=null;
const escapar=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normalizar=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,' ');
const barrios=v=>[...new Set(String(v??'').split('+').map(x=>x.trim()).filter(Boolean))];
const busca=c=>['Busca comprar','Busca alquilar'].includes(c.operacion);
const propietario=c=>['Quiere vender','Quiere alquilar propiedad'].includes(c.operacion);
const porId=(coleccion,id)=>datos[coleccion].find(x=>x.id===id);
const importe=(valor,moneda)=>`${moneda||'USD'} ${Number(valor||0).toLocaleString('es-AR',{maximumFractionDigits:2})}`;
const fechaHoy=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const fechaTexto=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||'')?v.split('-').reverse().join('/'): 'Sin fecha';
function fechaISO(valor){const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(valor);if(!m)throw new Error('Ingresá la fecha en formato DD/MM/AAAA.');const [dia,mes,anio]=m.slice(1).map(Number);const d=new Date(Date.UTC(anio,mes-1,dia));if(anio<1000||d.getUTCFullYear()!==anio||d.getUTCMonth()!==mes-1||d.getUTCDate()!==dia)throw new Error('Ingresá una fecha válida en formato DD/MM/AAAA.');return `${m[3]}-${m[2]}-${m[1]}`;}
const boton=(texto,accion,id='',clase='')=>{const limpio=labelLimpio(texto);const tipo=accion.includes('eliminar')?'trash':accion.includes('editar')?'edit':accion.includes('whatsapp')?'whatsapp':accion.includes('seguimiento')?'follow':accion==='propiedadCliente'?'property':limpio==='Volver'?'arrow':limpio.startsWith('Nuevo')||limpio.startsWith('+ Nuevo')||limpio.startsWith('Nueva')?'plus':accion.includes('coincidencia')?'match':'list';return `<button type="button" class="${clase}" data-accion="${accion}" data-id="${escapar(id)}">${icon(tipo)}<span>${escapar(limpio)}</span></button>`;};
const volver=destino=>boton('← Volver',`ir:${destino}`,'','secundario');
const cabecera=(titulo,sub='')=>{const limpio=labelLimpio(titulo);const simbolo=/[Cc]oincidencia/.test(limpio)?'match':/[Ss]eguimiento/.test(limpio)?'follow':/[Pp]ropiedad/.test(limpio)?'property':/[Cc]liente/.test(limpio)?'clients':null;return `<div class="bienvenida"><h2>${simbolo?icon(simbolo):''}${escapar(limpio)}</h2>${sub?`<p class="muted">${escapar(sub)}</p>`:''}</div>`;};
function avisar(texto,error=false){$('notificacion').innerHTML=`<div class="aviso ${error?'error':'exito'}">${escapar(texto)}</div>`;}

const SVG_PATHS={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',clients:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',property:'<path d="M4 21V3h12v18M16 9h4v12M2 21h20M8 7h4M8 11h4M8 15h4M8 21v-2h4v2"/>',match:'<path d="m8 3 4 4-4 4M4 7h8M16 13l-4 4 4 4M12 17h8"/><path d="M17 7h3M4 17h3"/>',follow:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18m-12 5 2 2 4-4"/>',plus:'<path d="M12 5v14M5 12h14"/>',edit:'<path d="m16 3 5 5-12 12-6 1 1-6zM14 5l5 5"/>',trash:'<path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/>',whatsapp:'<path d="M21 11.5a8.5 8.5 0 0 1-12.7 7.4L3 21l1.8-5.4A8.5 8.5 0 1 1 21 11.5Z"/><path d="M8 7c0 5 4 9 9 9l1-3-3-1-1 1-3-3 1-1-1-3z"/>',arrow:'<path d="m12 5-7 7 7 7M5 12h14"/>',right:'<path d="m9 5 7 7-7 7"/>',search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/>',pin:'<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',rooms:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16M3 12h9M12 9h9"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6 9 7 9-7"/>',phone:'<path d="m5 3 4 1 1 5-2 1a12 12 0 0 0 6 6l1-2 5 1 1 4c-10 4-22-8-16-16Z"/>',check:'<path d="m5 12 4 4L19 6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',wallet:'<rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 8h18M16 12h5v5h-5zM3 5l14-2v2"/>',key:'<circle cx="8" cy="8" r="5"/><path d="m12 12 9 9M16 16l3-3M18 18l3-3"/>',list:'<path d="M9 6h12M9 12h12M9 18h12M3 6h.01M3 12h.01M3 18h.01"/>'};
const icon=(name,extra='')=>`<svg class="svg-icon ${extra}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${SVG_PATHS[name]||SVG_PATHS.home}</svg>`;
const labelLimpio=v=>String(v).replace(/[👤🏠🎯📲📋➕👋🔎🔑←]/gu,'').trim();
const estadoBadge=(estado)=>`<span class="etiqueta estado-${escapar(normalizar(estado).replace(/\s+/g,'-'))}">${escapar(estado)}</span>`;
const iniciales=nombre=>String(nombre||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase();
const empty=(titulo,detalle,simbolo='list')=>`<div class="empty-state"><div class="tile-icon">${icon(simbolo)}</div><h3>${escapar(titulo)}</h3><p>${escapar(detalle)}</p></div>`;
const tile=(titulo,detalle,accion,simbolo)=>`<button type="button" class="tarjeta" data-accion="${accion}"><div class="tile-icon">${icon(simbolo)}</div><div><strong>${escapar(titulo)}</strong><span>${escapar(detalle)}</span></div></button>`;
const menuNav=()=>[['home','Inicio','inicio'],['clients','Clientes','clientes'],['property','Propiedades','propiedades'],['match','Coincidencias','coincidencias'],['follow','Seguimientos','seguimientos']].map(([i,t,d])=>`<button type="button" class="nav-link" data-destino="${d}">${icon(i)}<span>${t}</span></button>`).join('');
const abiertos=()=>datos.seguimientos.filter(s=>!['Cerrado','Descartado'].includes(s.estado));
function sincronizarNav(){const grupo=pantalla.startsWith('cliente')?'clientes':pantalla.startsWith('propiedad')?'propiedades':pantalla.startsWith('seguimiento')?'seguimientos':pantalla;document.querySelectorAll('[data-destino]').forEach(b=>{const activo=b.dataset.destino===grupo;b.classList.toggle('active',activo);if(activo)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});const nombres={inicio:'Inicio',clientes:'Clientes',propiedades:'Propiedades',coincidencias:'Coincidencias',seguimientos:'Seguimientos'};$('seccionActual').textContent=nombres[grupo]||'Inicio';}
function dashboard(){
 const pares=disponible('clientes','propiedades')?datos.clientes.reduce((n,c)=>n+datos.propiedades.filter(p=>coincide(c,p)).length,0):null;
 const proximos=abiertos().filter(s=>s.fecha>=fechaHoy()).sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha))).slice(0,3);
 const ultimos=[...datos.clientes].sort((a,b)=>(b.fechaCreacion?.toMillis?.()||0)-(a.fechaCreacion?.toMillis?.()||0)).slice(0,4);
 const metric=(titulo,n,detalle,i)=>`<div class="metric"><div class="metric-top"><span>${titulo}</span><div class="tile-icon">${icon(i)}</div></div><div class="metric-value">${n===null?'—':n}</div><div class="metric-foot">${detalle}</div></div>`;
 const panel=(titulo,i,accion,contenido)=>`<section class="panel"><div class="panel-title"><h3>${icon(i)}${titulo}</h3>${boton('Ver todos',accion,'','secundario')}</div>${contenido}</section>`;
 return `<div class="page-heading"><div><p class="page-eyebrow">Tu espacio de trabajo</p>${cabecera('Cada contacto, una oportunidad.','Tu cartera inmobiliaria, en movimiento.')}</div><span class="date-label">${fechaTexto(fechaHoy())}</span></div><div class="metrics">${metric('Clientes',disponible('clientes')?datos.clientes.length:null,'Contactos registrados','clients')}${metric('Propiedades',disponible('propiedades')?datos.propiedades.length:null,'En tu catálogo','property')}${metric('Coincidencias',pares,'Oportunidades compatibles','match')}${metric('Seguimientos abiertos',disponible('seguimientos')?abiertos().length:null,'Pendientes de resolución','follow')}</div><div class="dashboard-grid"><div><section class="panel"><div class="panel-title"><h3>${icon('plus')}Accesos rápidos</h3></div><div class="quick-actions">${tile('Nuevo cliente','Sumá un contacto','nuevoCliente','clients')}${tile('Nueva propiedad','Ampliá tu catálogo','nuevaPropiedad','property')}${tile('Ver coincidencias','Encontrá oportunidades','ir:coincidencias','match')}${tile('Nuevo seguimiento','Planificá el próximo paso','nuevoSeguimiento','follow')}</div></section>${panel('Últimos clientes','clients','ir:clientesLista',!disponible('clientes')?'<p class="panel-empty">Esperando la lectura de clientes…</p>':ultimos.length?ultimos.map(c=>`<div class="mini-row"><div class="avatar">${escapar(iniciales(c.nombre))}</div><div class="mini-content"><strong>${escapar(c.nombre)}</strong><p>${escapar(c.operacion)}${busca(c)?' · '+escapar(c.zona):''}</p></div><button type="button" data-accion="verCliente" data-id="${escapar(c.id)}" aria-label="Ver cliente ${escapar(c.nombre)}">${icon('right')}</button></div>`).join(''):`<div class="panel-empty">${icon('clients')}Todavía no hay clientes. Cargá el primero desde los accesos rápidos.</div>`)}</div><div class="dashboard-right">${panel('Próximos seguimientos','follow','ir:seguimientos',!disponible('seguimientos','clientes')?'<p class="panel-empty">Esperando la lectura de seguimientos…</p>':proximos.length?proximos.map(s=>`<div class="mini-row"><div class="tile-icon">${icon('follow')}</div><div class="mini-content"><strong>${escapar(porId('clientes',s.clienteId)?.nombre||'Cliente no disponible')}</strong><p>${fechaTexto(s.fecha)} · ${escapar(s.estado)}</p><p>${escapar(s.nota)}</p></div><button type="button" data-accion="editarSeguimiento" data-id="${escapar(s.id)}" aria-label="Ver seguimiento de ${escapar(porId('clientes',s.clienteId)?.nombre||'cliente')}">${icon('right')}</button></div>`).join(''):`<div class="panel-empty">${icon('follow')}No hay próximos seguimientos.${disponible('seguimientos')&&abiertos().some(s=>s.fecha<fechaHoy())?' Hay seguimientos vencidos: revisalos en el listado.':' Organizá tu próxima acción desde los accesos rápidos.'}</div>`)}${panel('Resumen de propiedades','property','ir:propiedades',!disponible('propiedades')?'<p class="panel-empty">Esperando la lectura de propiedades…</p>':datos.propiedades.length?`<div class="summary-row"><span>En venta</span><strong>${datos.propiedades.filter(p=>p.operacion==='Venta').length}</strong></div><div class="summary-row"><span>En alquiler</span><strong>${datos.propiedades.filter(p=>p.operacion==='Alquiler').length}</strong></div><div class="summary-row"><span>Disponibles</span><strong>${datos.propiedades.filter(p=>p.estado==='Disponible').length}</strong></div><div class="summary-row"><span>Reservadas</span><strong>${datos.propiedades.filter(p=>p.estado==='Reservada').length}</strong></div>`:`<div class="panel-empty">${icon('property')}Todavía no hay propiedades en el catálogo. Agregá una para encontrar coincidencias.</div>`)}</div></div>`;
}

function estadoConexion(){ $('conexion').innerHTML=Object.keys(datos).map(k=>errores[k]?`<div class="aviso error">No se pudo leer ${k}: ${escapar(errores[k])}. Revisá la conexión y los permisos de Firestore. ${boton('Reintentar lectura','recargar',k)}</div>`:!carga[k]?`<p class="muted">Cargando ${k}…</p>`:'').join(''); }
function disponible(...nombres){return nombres.every(k=>carga[k]&&!errores[k]);}
function requerir(...nombres){if(!disponible(...nombres)){avisar('Esperá a que los datos se carguen o reintentá la lectura antes de continuar.',true);return false;}return true;}
const suscripciones={};
function escuchar(nombre){
 suscripciones[nombre]?.();carga[nombre]=false;delete errores[nombre];estadoConexion();
 suscripciones[nombre]=onSnapshot(collection(db,nombre),s=>{datos[nombre]=s.docs.map(d=>({...d.data(),id:d.id}));carga[nombre]=true;delete errores[nombre];estadoConexion();if(!pantalla.endsWith('Formulario'))renderizar();},e=>{carga[nombre]=false;errores[nombre]=e.code||e.message;estadoConexion();if(!pantalla.endsWith('Formulario'))renderizar();});
}
function cambiar(destino){if(ocupado)return; pantalla=destino;edicion=null;referenciaNueva=null;consulta='';filtroEstado='';$('notificacion').textContent='';renderizar();window.scrollTo(0,0);}
function opciones(valores,valor,placeholder=''){return (placeholder?`<option value="">${escapar(placeholder)}</option>`:'')+valores.map(v=>`<option value="${escapar(v)}" ${v===valor?'selected':''}>${escapar(v)}</option>`).join('');}

function listaPropiedades(){if(!disponible('propiedades'))return '<p class="loading-line">El listado estará disponible al completar la lectura de propiedades.</p>';const lista=datos.propiedades.filter(p=>normalizar([p.direccion,p.zona,p.tipo,p.operacion,p.estado].join(' ')).includes(normalizar(consulta))).sort((a,b)=>String(a.direccion||'').localeCompare(String(b.direccion||''),'es'));return lista.length?lista.map(p=>`<article class="registro property-card"><div class="property-cover">${icon(p.tipo==='Casa'?'home':'property')}<span>${escapar(p.tipo)}</span></div><div class="property-meta">${estadoBadge(p.operacion)}${estadoBadge(p.estado||'Disponible')}</div><div class="property-heading"><div class="property-icon">${icon(p.tipo==='Casa'?'home':'property')}</div><div><h3>${escapar(p.direccion)}</h3><p class="record-subtitle">${escapar(p.tipo)} · ${escapar(p.zona)}</p></div></div><div class="record-price">${escapar(importe(p.precio,p.moneda))}</div><div class="record-info"><span>${icon('rooms')}${escapar(p.ambientes)} ambientes</span><span>${icon('pin')}${escapar(p.zona)}</span></div><p class="owner-row">Propietario: <strong>${escapar(porId('clientes',p.propietarioId)?.nombre||(p.propietarioId?'Cliente no disponible':'Sin vincular'))}</strong></p>${p.descripcion?`<p class="property-description">${escapar(p.descripcion)}</p>`:''}<div class="acciones">${boton('Editar','editarPropiedad',p.id)}${boton('Eliminar','eliminarPropiedad',p.id,'peligro')}</div></article>`).join(''):empty('No hay propiedades para mostrar.',consulta?'Probá con otra dirección, barrio o estado.':'Agregá propiedades reales para empezar a encontrar coincidencias.','property');}

function listaCoincidencias(){if(!disponible('clientes','propiedades'))return '<p class="loading-line">Esperando los datos de clientes y propiedades.</p>';const pares=datos.clientes.flatMap(c=>datos.propiedades.filter(p=>coincide(c,p)).map(p=>({c,p})));return pares.length?pares.map(({c,p})=>`<article class="registro match-card"><div class="match-pair"><div class="match-side"><p class="match-label">Cliente interesado</p><h3><button type="button" class="client-open" data-accion="verCliente" data-id="${escapar(c.id)}">${escapar(c.nombre)}</button></h3><p class="record-subtitle">${escapar(c.operacion)}</p></div><div class="match-connector">${icon('match')}</div><div class="match-side"><p class="match-label">Propiedad compatible</p><h3>${escapar(p.direccion)}</h3><p class="record-subtitle">${escapar(p.operacion)} · ${escapar(p.estado)}</p></div></div><dl class="match-criteria"><div><dt>Zona compatible</dt><dd>${escapar(p.zona)}<br><span class="muted">Busca: ${escapar(c.zona)}</span></dd></div><div><dt>Tipo de propiedad</dt><dd>${escapar(p.tipo)}<br><span class="muted">Busca: ${escapar((c.tiposPropiedad||[]).join(', '))}</span></dd></div><div><dt>Ambientes</dt><dd>${escapar(p.ambientes)} ambientes<br><span class="muted">Mínimo: ${escapar(c.ambientes)}</span></dd></div><div><dt>Moneda</dt><dd>${escapar(p.moneda)} · misma moneda</dd></div><div><dt>Presupuesto del cliente</dt><dd>${escapar(importe(c.presupuestoMaximo,c.moneda))}</dd></div><div><dt>Precio de la propiedad</dt><dd>${escapar(importe(p.precio,p.moneda))}</dd></div></dl><p class="match-check">${icon('check')}Cumple tipo, barrio, moneda, presupuesto y ambientes mínimos.</p><div class="acciones">${boton('Preparar WhatsApp','whatsappCoincidencia',JSON.stringify([c.id,p.id]))}${boton('Crear seguimiento','seguimientoCoincidencia',JSON.stringify([c.id,p.id]))}</div></article>`).join(''):empty('Todavía no hay coincidencias.','Cargá clientes y propiedades disponibles que cumplan los criterios. Las oportunidades compatible function listaSeguimientos(){if(!disponible('seguimientos','clientes','propiedades'))return '<p class="loading-line">Esperando los datos para mostrar seguimientos.</p>';const lista=datos.seguimientos.filter(s=>!filtroEstado||s.estado===filtroEstado).sort((a,b)=>String(a.fecha||'').localeCompare(String(b.fecha||'')));return lista.length?lista.map(s=>`<article class="registro follow-card"><div class="record-heading"><div class="record-title"><div class="avatar">${icon('follow')}</div><h3>${escapar(porId('clientes',s.clienteId)?.nombre||'Cliente no disponible')}</h3></div>${estadoBadge(s.estado)}</div><div class="follow-date">${icon('clock')}${fechaTexto(s.fecha)}${s.fecha<fechaHoy()&&!['Cerrado','Descartado'].includes(s.estado)?estadoBadge('Vencido'):''}</div><div class="record-info"><span>${icon('property')}${escapar(porId('propiedades',s.propiedadId)?.direccion||'Sin propiedad vinculada')}</span></div><p class="follow-note"><strong>Próxima acción / nota</strong>${escapar(s.nota)}</p><div class="acciones">${boton('Editar','editarSeguimiento',s.id)}${boton('Eliminar','eliminarSeguimiento',s.id,'peligro')}${porId('clientes',s.clienteId)?boton('WhatsApp','whatsappCliente',s.clienteId):''}</div></article>`).join(''):empty('No hay seguimientos para mostrar.',filtroEstado?'No hay registros con ese estado.':'Planificá una visita, un contacto o tu próxima acción para un cliente.','follow');}
function renderizar(){let html='';switch(pantalla){case 'inicio':html=dashboard();break;case 'clientes':case 'clientesLista':html=cabecera('Clientes','Cada búsqueda empieza con una persona.')+boton('+ Nuevo cliente','nuevoCliente')+`<div class="search-wrap"><div>${barraBusqueda('Buscar cliente por nombre, teléfono, email o barrio')}</div></div><div id="lista">${listaClientes()}</div>`+volver('inicio');break;case 'clienteFicha':html=fichaCliente();break;case 'clienteFormulario':html=formularioCliente();break;case 'propiedades':html=cabecera('Propiedades','Un catálogo organizado para cada oportunidad.')+boton('Nueva propiedad','nuevaPropiedad')+`<div class="search-wrap"><div>${barraBusqueda('Buscar por dirección, barrio, tipo, operación o estado')}</div></div><div id="lista">${listaPropiedades()}</div>`+volver('inicio');break;case 'propiedadFormulario':html=formularioPropiedad();break;case 'coincidencias':html=cabecera('Coincidencias','Clientes interesados y propiedades compatibles. Misma operación y moneda, tipo y barrio compatibles, precio dentro del presupuesto y ambientes mínimos.')+listaCoincidencias()+volver('inicio');break;case 'seguimientos':html=cabecera('Seguimientos','Cada contacto, visita y próxima acción, en orden.')+boton('Nuevo seguimiento','nuevoSeguimiento')+`<div class="search-wrap"><div>${selector('filtroEstado','Filtrar por estado',ESTADOS,filtroEstado,'Todos')}</div></div><div id="lista">${listaSeguimientos()}</div>`+volver('inicio');break;case 'seguimientoFormulario':html=formularioSeguimiento();break;} $('pantalla').innerHTML=html;if(pantalla==='clienteFormulario')ajustarOperacion();sincronizarNav();bloquear(ocupado);}

 const anterior=porId(nombre,ref.id)||{};datos[nombre]=datos[nombre].filter(x=>x.id!==ref.id).concat({...anterior,...payload,id:ref.id});bloquear(false);window.borradorPropiedad=null;window.borradorSeguimiento=null;cambiar(nombre==='clientes'?'clientesLista':nombre);avisar(editando?'Cambios guardados.':'Registro guardado correctamente. El formulario quedó limpio.');
 }catch(e){errorOperacion(e);}finally{bloquear(false);}}
async function eliminar(nombre,id){if(ocupado||!requerir('clientes','propiedades','seguimientos'))return;const registro=porId(nombre,id);if(!registro)return;const props=nombre==='clientes'?datos.propiedades.filter(p=>p.propietarioId===id):[];const segs=nombre==='clientes'?datos.seguimientos.filter(s=>s.clienteId===id):nombre==='propiedades'?datos.seguimientos.filter(s=>s.propiedadId===id):[];
 if(props.length+segs.length+1>450){avisar('Hay demasiados vínculos para eliminar este registro en una sola operación. Reducí los seguimientos asociados primero.',true);return;}
 const detalle=nombre==='clientes'?` Se eliminarán ${segs.length} seguimientos y ${props.length} propiedades quedarán sin propietario (las propiedades se conservan).`:nombre==='propiedades'?` Se conservarán los seguimientos, quitando ${segs.length} vínculos con esta propiedad.`:'';
 if(!confirm(`¿Eliminar ${registro.nombre||registro.direccion||'este seguimiento'}?${detalle} Esta acción no se puede deshacer.`))return;
 bloquear(true);try{const lote=writeBatch(db);lote.delete(doc(db,nombre,id));props.forEach(p=>lote.update(doc(db,'propiedades',p.id),{propietarioId:'',fechaActualizacion:serverTimestamp()}));segs.forEach(s=>nombre==='clientes'?lote.delete(doc(db,'seguimientos',s.id)):lote.update(doc(db,'seguimientos',s.id),{propiedadId:'',fechaActualizacion:serverTimestamp()}));await lote.commit();datos[nombre]=datos[nombre].filter(x=>x.id!==id);if(nombre==='clientes'){datos.propiedades=datos.propiedades.map(p=>p.propietarioId===id?{...p,propietarioId:''}:p);datos.seguimientos=datos.seguimientos.filter(s=>s.clienteId!==id);}if(nombre==='propiedades')datos.seguimientos=datos.seguimientos.map(s=>s.propiedadId===id?{...s,propiedadId:''}:s);renderizar();avisar('Registro eliminado.');}catch(e){errorOperacion(e);}finally{bloquear(false);}}
function abrirFormulario(tipo,id=null){const coleccion={cliente:'clientes',propiedad:'propiedades',seguimiento:'seguimientos'}[tipo];if(id&&!porId(coleccion,id))return;if(tipo==='propiedad'&&!requerir('clientes','propiedades'))return;if(tipo==='seguimiento'&&!requerir('clientes','propiedades','seguimientos'))return;cambiar(tipo+'Formulario');edicion=id;renderizar();}
function prepararWhatsApp(c,p=null){if(!c)return;const telefono=String(c.telefono||'').replace(/\D/g,'');if(!/^\d{8,15}$/.test(telefono)){avisar('Editá el teléfono del cliente e ingresalo con código de país; por ejemplo +54 9 11 1234 5678.',true);return;}let mensaje=`Hola ${c.nombre}, ¿cómo estás? Te contacto por tu consulta inmobiliaria.`;if(p)mensaje=`Hola ${c.nombre}, encontré una propiedad que coincide con tu búsqueda: ${p.tipo} en ${p.zona}, ${p.direccion}, ${p.ambientes} ambientes, ${importe(p.precio,p.moneda)} (${p.operacion}). ¿Querés que coordinemos una visita?`;const url=`https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`;window.open(url,'_blank','noopener,noreferrer');}
$('pantalla').addEventListener('click',e=>{const b=e.target.closest('[data-accion]');if(!b||ocupado)return;const accion=b.dataset.accion,id=b.dataset.id;if(accion.startsWith('ir:'))return cambiar(accion.slice(3));switch(accion){case 'verCliente':abrirFicha(id);break;case 'nuevoCliente':abrirFormulario('cliente');break;case 'editarCliente':abrirFormulario('cliente',id);break;case 'eliminarCliente':eliminar('clientes',id);break;case 'nuevaPropiedad':window.borradorPropiedad=null;abrirFormulario('propiedad');break;case 'editarPropiedad':abrirFormulario('propiedad',id);break;case 'eliminarPropiedad':eliminar('propiedades',id);break;case 'nuevoSeguimiento':window.borradorSeguimiento=null;abrirFormulario('seguimiento');break;case 'editarSeguimiento':abrirFormulario('seguimiento',id);break;case 'eliminarSeguimiento':eliminar('seguimientos',id);break;case 'whatsappCliente':prepararWhatsApp(porId('clientes',id));break;case 'whatsappCoincidencia':{const [c,p]=JSON.parse(id);prepararWhatsApp(porId('clientes',c),porId('propiedades',p));break;}case 'seguimientoCliente':window.borradorSeguimiento={clienteId:id};abrirFormulario('seguimiento');break;case 'seguimientoCoincidencia':{const [c,p]=JSON.parse(id);window.borradorSeguimiento={clienteId:c,propiedadId:p};abrirFormulario('seguimiento');break;}case 'propiedadCliente':{if(!requerir('clientes','propiedades'))break;const c=porId('clientes',id);if(!c?.propiedad)break;const existente=datos.propiedades.find(p=>p.propietarioId===id&&normalizar(p.direccion)===normalizar(c.propiedad.direccion));if(existente){avisar('Esa propiedad ya está cargada. Se abrió para editarla.');abrirFormulario('propiedad',existente.id);}else{window.borradorPropiedad={...c.propiedad,propietarioId:id,operacion:c.operacion==='Quiere vender'?'Venta':'Alquiler',estado:'Disponible'};abrirFormulario('propiedad');}break;}}});
$('conexion').addEventListener('click',e=>{const b=e.target.closest('[data-accion="recargar"]');if(b&&!ocupado)escuchar(b.dataset.id);});

// Numeric keyboards can enter the date without needing a slash key.
$('pantalla').addEventListener('input',e=>{if(e.target.id!=='seguimientoFecha')return;const campo=e.target;const antes=campo.value.slice(0,campo.selectionStart).replace(/\D/g,'').length;const digitos=campo.value.replace(/\D/g,'').slice(0,8);const nuevo=digitos.slice(0,2)+(digitos.length>2?'/'+digitos.slice(2,4):'')+(digitos.length>4?'/'+digitos.slice(4):'');if(campo.value!==nuevo){campo.value=nuevo;const cursor=Math.min(nuevo.length,antes+(antes>2?1:0)+(antes>4?1:0));campo.setSelectionRange(cursor,cursor);}});
$('pantalla').addEventListener('input',e=>{if(e.target.id==='buscar'){consulta=e.target.value;$('lista').innerHTML=['clientes','clientesLista'].includes(pantalla)?listaClientes():listaPropiedades();}});

for(const id of ['navDesktop','navMobile'])$(id).addEventListener('click',e=>{const b=e.target.closest('[data-destino]');if(b&&!ocupado)cambiar(b.dataset.destino);});
renderizar();Object.keys(datos).forEach(escuchar);

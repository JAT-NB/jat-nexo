<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JAT Nexo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #071b33;
      color: white;
    }

    header {
      background: linear-gradient(135deg, #09284d, #075f82);
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 8px 0 0;
      color: #b9d7e8;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 25px 15px;
    }

    .bienvenida {
      background: #0d2948;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .bienvenida h2 {
      margin-top: 0;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .tarjeta {
      background: #0d2948;
      border-radius: 16px;
      padding: 25px 15px;
      text-align: center;
      cursor: pointer;
    }

    .tarjeta:hover {
      background: #123a61;
    }

    .icono {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .tarjeta h3 {
      margin: 0;
    }

    footer {
      text-align: center;
      padding: 30px 10px;
      color: #7794ad;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .menu {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>JAT Nexo</h1>
    <p>Tu asistente inmobiliario</p>
  </header>

  <main>

    <section class="bienvenida">
      <h2>Bienvenido 👋</h2>
      <p>
        Organizá tus clientes, propiedades y oportunidades
        desde un solo lugar.
      </p>
    </section>

    <section class="menu">

      <div class="tarjeta">
        <div class="icono">👤</div>
        <h3>Clientes</h3>
      </div>

      <div class="tarjeta">
        <div class="icono">🏠</div>
        <h3>Propiedades</h3>
      </div>

      <div class="tarjeta">
        <div class="icono">🎯</div>
        <h3>Coincidencias</h3>
      </div>

      <div class="tarjeta">
        <div class="icono">📲</div>
        <h3>Seguimientos</h3>
      </div>

    </section>

  </main>

  <footer>
    JAT Nexo
  </footer>

</body>
</html>

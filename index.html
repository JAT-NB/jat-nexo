<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JAT Nexo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #071b33;
      color: white;
    }

    header {
      background: linear-gradient(135deg, #09284d, #075f82);
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 8px 0 0;
      color: #b9d7e8;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 25px 15px;
    }

    .bienvenida {
      background: #0d2948;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .bienvenida h2 {
      margin-top: 0;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .tarjeta {
      background: #0d2948;
      border-radius: 16px;
      padding: 25px 15px;
      text-align: center;
      cursor: pointer;
    }

    .tarjeta:hover {
      background: #123a61;
    }

    .icono {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .tarjeta h3 {
      margin: 0;
    }

input,
select {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border: 1px solid #244866;
  border-radius: 10px;
  background: #071b33;
  color: white;
  font-size: 16px;
}

input::placeholder {
  color: #8fa8bb;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: none;
  border-radius: 10px;
  background: #087da3;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #0a91bb;
}
    
    footer {
      text-align: center;
      padding: 30px 10px;
      color: #7794ad;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .menu {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>JAT Nexo</h1>
    <p>Tu asistente inmobiliario</p>
  </header>

  <main>

    <section class="bienvenida">
      <h2>Bienvenido 👋</h2>
      <p>
        Organizá tus clientes, propiedades y oportunidades
        desde un solo lugar.
      </p>
    </section>

    <section class="menu">

     <div class="tarjeta" onclick="abrirClientes()">
        <div class="icono">👤</div>
        <h3>Clientes</h3>
      </div>

      <div class="tarjeta">
        <div class="icono">🏠</div>
        <h3>Propiedades</h3>
      </div>

      <div class="tarjeta">
        <div class="icono">🎯</div>
        <h3>Coincidencias</h3>
      </div>

      <div class="tarjeta">
        <div class="icono">📲</div>
        <h3>Seguimientos</h3>
      </div>

    </section>

<section id="pantallaClientes" style="display:none;">

  <div class="bienvenida">
    <h2>👤 Clientes</h2>
    <p>Administrá tus clientes y lo que está buscando cada uno.</p>
  </div>

  <div class="bienvenida">

    <h3>Nuevo cliente</h3>

    <input
      type="text"
      id="clienteNombre"
      placeholder="Nombre y apellido"
    >

    <input
      type="tel"
      id="clienteTelefono"
      placeholder="Teléfono / WhatsApp"
    >

   

 <select id="clienteOperacion" onchange="cambiarTipoCliente()">
 <option value="" selected disabled hidden>¿Qué necesita el cliente?</option>
  <option value="Busca comprar">🔎 Busca comprar</option>
  <option value="Busca alquilar">🔎 Busca alquilar</option>
  <option value="Quiere vender">🏠 Quiere vender</option>
  <option value="Quiere alquilar propiedad">🔑 Quiere alquilar su propiedad</option>
</select>

<div id="datosBusqueda">

  <select id="clienteTipoPropiedad">
    <option value="">Tipo de propiedad que busca</option>
    <option value="Departamento">Departamento</option>
    <option value="Casa">Casa</option>
    <option value="PH">PH</option>
    <option value="Local">Local</option>
    <option value="Oficina">Oficina</option>
    <option value="Terreno">Terreno</option>
    <option value="Otro">Otro</option>
  </select>

  <input
    type="text"
    id="clienteZona"
    placeholder="Barrios que busca (separar con +)"
  >
    
<div id="datosBusqueda">

 <input
      type="text"
      id="clienteZona"
     placeholder="Barrios que busca (separar con +)"
    >

<select id="clienteMoneda">
  <option value="USD">USD - Dólares</option>
  <option value="ARS">ARS - Pesos argentinos</option>
</select>
  
    <input
      type="number"
      id="clientePresupuesto"
      placeholder="Presupuesto máximo"
    >

    <input
      type="number"
      id="clienteAmbientes"
      placeholder="Cantidad de ambientes"
    >

</div>

    <div id="datosPropiedad" style="display:none;">

  <input
    type="text"
    id="propiedadDireccion"
    placeholder="Dirección de la propiedad"
  >

  <input
    type="text"
    id="propiedadZona"
    placeholder="Barrio / Zona"
  >

  <select id="propiedadTipo">
    <option value="">Tipo de propiedad</option>
    <option value="Departamento">Departamento</option>
    <option value="Casa">Casa</option>
    <option value="PH">PH</option>
    <option value="Local">Local</option>
    <option value="Oficina">Oficina</option>
    <option value="Terreno">Terreno</option>
    <option value="Otro">Otro</option>
  </select>

  <input
    type="number"
    id="propiedadAmbientes"
    placeholder="Cantidad de ambientes"
  >

<select id="propiedadMoneda">
  <option value="USD">USD - Dólares</option>
  <option value="ARS">ARS - Pesos argentinos</option>
</select>
      
  <input
    type="number"
    id="propiedadPrecio"
    placeholder="Precio pretendido"
  >

</div>
  
    <button type="button">
      Guardar cliente
    </button>

    <button type="button" onclick="volverInicio()">
      ← Volver
    </button>

  </div>

</section>
    
  </main>

  <footer>
    JAT Nexo
  </footer>

<script>

function abrirClientes() {

  document.querySelector(".bienvenida").style.display = "none";
  document.querySelector(".menu").style.display = "none";

  document.getElementById("pantallaClientes").style.display = "block";

}


function volverInicio() {

  document.getElementById("pantallaClientes").style.display = "none";

  document.querySelector(".bienvenida").style.display = "block";
  document.querySelector(".menu").style.display = "grid";

function cambiarTipoCliente() {

  const operacion =
    document.getElementById("clienteOperacion").value;

  const datosBusqueda =
    document.getElementById("datosBusqueda");

  const datosPropiedad =
    document.getElementById("datosPropiedad");

  if (
    operacion === "Quiere vender" ||
    operacion === "Quiere alquilar propiedad"
  ) {

    datosBusqueda.style.display = "none";
    datosPropiedad.style.display = "block";

  } else {

    datosBusqueda.style.display = "block";
    datosPropiedad.style.display = "none";

  }

}
  
}

</script>
  
</body>
</html>

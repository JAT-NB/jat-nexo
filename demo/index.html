<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JAT Nexo | Demo</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#102c46;background:#f2f6fb}*{box-sizing:border-box}body{margin:0}aside{background:#092a45;color:white;padding:28px 20px;min-height:100vh;width:238px;position:fixed}aside h2{margin:0}aside p{color:#a8c5d9;font-size:12px;margin:6px 0 40px}nav button{width:100%;display:block;background:transparent;color:#e6f4ff;text-align:left;border:0;padding:14px;border-radius:10px;font-size:15px;cursor:pointer}nav button.active,nav button:hover{background:#1266ae}main{margin-left:238px;padding:36px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.tag{background:#fff3cf;border:1px solid #f4d477;border-radius:12px;padding:9px 14px;color:#785009;font-weight:700}.panel{background:white;border:1px solid #dce7f2;border-radius:18px;padding:24px;margin-top:22px;box-shadow:0 5px 25px #1231}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat{background:white;border:1px solid #dce7f2;border-radius:14px;padding:20px}.stat b{font-size:32px;display:block;margin-top:10px}.muted{color:#647a8f}.btn{background:#086cc8;color:white;border:0;border-radius:9px;padding:11px 16px;cursor:pointer;font-weight:700}.secondary{background:#e8f1fa;color:#123c60}.danger{background:#fff0f0;color:#a32121}input,select,textarea{padding:11px;border:1px solid #cbd9e6;border-radius:8px;font:inherit;width:100%;background:white}label{display:block;font-size:13px;font-weight:650;margin:10px 0 5px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.item{border:1px solid #e0e9f2;border-radius:12px;padding:16px;margin:12px 0;background:#fff}.item strong{font-size:17px}.item p{margin:7px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hero{background:linear-gradient(120deg,#092a45,#0a5c9d);color:white;border-radius:18px;padding:32px;margin-bottom:22px}.hero p{color:#d5eafb}.hidden{display:none}@media(max-width:700px){aside{position:static;min-height:auto;width:auto;padding:15px}aside p{margin:4px 0 12px}nav{display:flex;overflow:auto;gap:5px}nav button{white-space:nowrap;width:auto;padding:10px}main{margin:0;padding:16px}.stats,.grid{grid-template-columns:1fr}.panel{padding:16px}}
</style></head><body><aside><h2>⌂ JAT Nexo</h2><p>Tu asistente inmobiliario · DEMO</p><nav id="nav"></nav></aside><main><div class="top"><h1 id="title">Inicio</h1><span class="tag">● MODO DEMOSTRACIÓN</span></div><div id="view"></div></main><script>
const key='jat-nexo-demo-isolada-v1',seed={clientes:[{id:'c1',nombre:'María González',telefono:'11 5550 1234',email:'maria@example.com',operacion:'Compra',tipo:'Departamento',zona:'Palermo',presupuesto:180000,ambientes:3},{id:'c2',nombre:'Carlos Méndez',telefono:'11 5550 5678',email:'carlos@example.com',operacion:'Compra',tipo:'Casa',zona:'Caballito',presupuesto:270000,ambientes:4},{id:'c3',nombre:'Laura Fernández',telefono:'11 5550 9012',email:'laura@example.com',operacion:'Venta',tipo:'Departamento',zona:'Palermo',presupuesto:0,ambientes:3}],propiedades:[{id:'p1',direccion:'Av. Santa Fe 1042',zona:'Palermo',tipo:'Departamento',ambientes:3,precio:165000,operacion:'Venta',estado:'Disponible'},{id:'p2',direccion:'Av. Rivadavia 5200',zona:'Caballito',tipo:'Casa',ambientes:4,precio:245000,operacion:'Venta',estado:'Disponible'},{id:'p3',direccion:'Av. Cabildo 2100',zona:'Belgrano',tipo:'Departamento',ambientes:3,precio:172000,operacion:'Venta',estado:'Disponible'}],seguimientos:[{id:'s1',clienteId:'c1',propiedadId:'p1',fecha:'2026-10-15',estado:'Visita agendada',nota:'Coordinar visita a Palermo'}]};
let data;try{data=JSON.parse(localStorage.getItem(key))||structuredClone(seed)}catch{data=structuredClone(seed)};let page='Inicio';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'USD '+Number(n||0).toLocaleString('es-AR'),save=()=>localStorage.setItem(key,JSON.stringify(data)),find=(k,id)=>data[k].find(x=>x.id===id),btn=(label,action,cl='')=>'<button class="btn '+cl+'" data-action="'+esc(action)+'">'+esc(label)+'</button>',field=(name,label,val='',type='text')=>'<div><label>'+label+'</label><input name="'+name+'" type="'+type+'" value="'+esc(val)+'" '+(name==='nombre'||name==='direccion'?'required':'')+'></div>',select=(name,label,opts,val)=>'<div><label>'+label+'</label><select name="'+name+'">'+opts.map(o=>'<option '+(o===val?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select></div>';
function card(k,x){let title=k==='clientes'?x.nombre:k==='propiedades'?x.direccion:(find('clientes',x.clienteId)?.nombre||'Cliente');let desc=k==='clientes'?x.operacion+' · '+x.tipo+' · '+x.zona+' · '+money(x.presupuesto):k==='propiedades'?x.tipo+' · '+x.zona+' · '+x.ambientes+' ambientes · '+money(x.precio):x.estado+' · '+x.fecha+' · '+x.nota;return '<div class="item"><strong>'+esc(title)+'</strong><p class="muted">'+esc(desc)+'</p><div class="actions">'+btn('Editar','edit:'+k+':'+x.id,'secondary')+btn('Eliminar','delete:'+k+':'+x.id,'danger')+'</div></div>'}
function form(k,id){let x=id?find(k,id):{};if(!x)return;let fields=k==='clientes'?field('nombre','Nombre',x.nombre)+field('telefono','Teléfono',x.telefono)+field('email','Email',x.email,'email')+select('operacion','Operación',['Compra','Alquiler','Venta'],x.operacion)+select('tipo','Tipo de propiedad',['Departamento','Casa','PH','Local','Oficina'],x.tipo)+field('zona','Barrio',x.zona)+field('presupuesto','Presupuesto máximo USD',x.presupuesto||0,'number')+field('ambientes','Ambientes mínimos',x.ambientes||1,'number'):k==='propiedades'?field('direccion','Dirección',x.direccion)+field('zona','Barrio',x.zona)+select('tipo','Tipo',['Departamento','Casa','PH','Local','Oficina'],x.tipo)+field('ambientes','Ambientes',x.ambientes||2,'number')+field('precio','Precio USD',x.precio||0,'number')+select('operacion','Operación',['Venta','Alquiler'],x.operacion)+select('estado','Estado',['Disponible','Reservada','Vendida','Alquilada'],x.estado):select('clienteId','Cliente',data.clientes.map(c=>c.id),x.clienteId)+select('propiedadId','Propiedad',data.propiedades.map(p=>p.id),x.propiedadId)+field('fecha','Fecha',x.fecha||new Date().toISOString().slice(0,10),'date')+select('estado','Estado',['Pendiente','Contactado','Visita agendada','En negociación','Cerrado'],x.estado)+field('nota','Próxima acción',x.nota);$('view').innerHTML='<section class="panel"><h2>'+(id?'Editar':'Nuevo')+' '+k.slice(0,-1)+'</h2><form id="editor" data-kind="'+k+'" data-id="'+esc(id||'')+'"><div class="grid">'+fields+'</div><div class="actions"><button class="btn">Guardar</button>'+btn('Cancelar','page:'+k,'secondary')+'</div></form></section>'}
function matches(){let out=[];for(let c of data.clientes.filter(x=>x.operacion==='Compra'))for(let p of data.propiedades){if(p.operacion!=='Venta'||p.estado!=='Disponible')continue;const same=c.tipo===p.tipo&&c.zona.toLowerCase()===p.zona.toLowerCase()&&p.precio<=Number(c.presupuesto)&&p.ambientes>=Number(c.ambientes);if(same)out.push('<div class="item"><strong>'+esc(c.nombre)+' ↔ '+esc(p.direccion)+'</strong><p>'+esc(p.zona)+' · '+money(p.precio)+' · '+p.ambientes+' ambientes</p>'+btn('Crear seguimiento','follow:'+c.id+':'+p.id)+'</div>')}return out.join('')||'<p>No hay coincidencias con los filtros actuales. Probá cambiando los datos de los clientes o las propiedades.</p>'}
function render(){let pages=['Inicio','clientes','propiedades','Coincidencias','seguimientos','Ayuda'];$('nav').innerHTML=pages.map(p=>'<button data-action="page:'+p+'" class="'+(p===page?'active':'')+'">'+({Inicio:'⌂ Inicio',clientes:'♙ Clientes',propiedades:'▤ Propiedades',Coincidencias:'✦ Coincidencias',seguimientos:'▣ Seguimientos',Ayuda:'▧ Ayuda y manual'}[p])+'</button>').join('');$('title').textContent=page[0].toUpperCase()+page.slice(1);let v='';if(page==='Inicio'){v='<div class="hero"><h2>Todo tu negocio inmobiliario, en un solo lugar</h2><p>Explorá la demo con información ficticia. Los cambios se guardan únicamente en tu navegador.</p>'+btn('Restablecer datos de ejemplo','reset','secondary')+'</div><div class="stats">'+[['Clientes',data.clientes.length],['Propiedades',data.propiedades.length],['Coincidencias', (matches().match(/class="item"/g)||[]).length],['Seguimientos',data.seguimientos.length]].map(x=>'<div class="stat">'+x[0]+'<b>'+x[1]+'</b></div>').join('')+'</div><section class="panel"><h2>Probá las funciones</h2><p>Podés agregar clientes y propiedades, encontrar coincidencias y organizar visitas.</p>'+btn('Ver clientes','page:clientes')+' '+btn('Ver propiedades','page:propiedades')+'</section>'}else if(['clientes','propiedades','seguimientos'].includes(page)){v='<section class="panel"><div class="top"><h2>'+page[0].toUpperCase()+page.slice(1)+'</h2>'+btn('+ Nuevo','new:'+page)+'</div>'+data[page].map(x=>card(page,x)).join('')+'</section>'}else if(page==='Coincidencias'){v='<section class="panel"><h2>Coincidencias inteligentes</h2><p class="muted">Compradores compatibles por barrio, tipo, presupuesto y ambientes.</p>'+matches()+'</section>'}else{v='<section class="panel"><h2>Bienvenido a JAT Nexo</h2><p>Esta es una demostración independiente para conocer las funciones de la plataforma.</p><h3>01 · Clientes</h3><p>Registrá compradores y vendedores, sus datos de contacto y sus necesidades.</p><h3>02 · Propiedades</h3><p>Cargá inmuebles, precios, ubicación y disponibilidad.</p><h3>03 · Coincidencias</h3><p>Encontrá propiedades compatibles con compradores según sus requisitos.</p><h3>04 · Seguimientos</h3><p>Organizá visitas, próximas acciones y estados de cada oportunidad.</p><h3>Privacidad de la demo</h3><p>Esta demo no se conecta a la base de datos real de JAT Nexo. Los cambios quedan en este navegador. No ingreses datos personales reales.</p>'+btn('Restablecer demo','reset')+'</section>'}$('view').innerHTML=v}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let [a,k,id]=b.dataset.action.split(':');if(a==='page'){page=k;render()}if(a==='new')form(k);if(a==='edit')form(k,id);if(a==='delete'){if(confirm('¿Eliminar este registro de la demo?')){data[k]=data[k].filter(x=>x.id!==id);save();render()}}if(a==='reset'){if(confirm('¿Restablecer todos los datos ficticios?')){data=structuredClone(seed);save();page='Inicio';render()}}if(a==='follow'){data.seguimientos.push({id:crypto.randomUUID(),clienteId:k,propiedadId:id,fecha:new Date().toISOString().slice(0,10),estado:'Pendiente',nota:'Contactar al cliente'});save();page='seguimientos';render()}});
document.addEventListener('submit',e=>{if(e.target.id!=='editor')return;e.preventDefault();let f=e.target,k=f.dataset.kind,id=f.dataset.id;let x=Object.fromEntries(new FormData(f));for(let n of ['presupuesto','precio','ambientes'])if(n in x)x[n]=Number(x[n]);if(id){Object.assign(find(k,id),x)}else data[k].push({id:crypto.randomUUID(),...x});save();page=k;render()});render();
</script></body></html>
